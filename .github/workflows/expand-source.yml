name: expand-polished-source

on:
  push:
    branches: [agent/initial-theory-experiments]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-theory-experiments
      - name: Verify and publish clean source tree
        shell: bash
        run: |
          set -euo pipefail
          echo 'ea96bba9633f48416d5a9665bcc81c2ab3e2a9a397a2a537ff7042d58fd7899a  bootstrap/source.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/epoc-source
          tar -xzf bootstrap/source.tar.gz -C /tmp/epoc-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/epoc-source/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish manuscript and expand literature audit'
          git push origin HEAD:agent/initial-theory-experiments
