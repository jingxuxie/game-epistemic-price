name: publish-epoc-source

on:
  pull_request_target:
    types: [synchronize, edited, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.ref == 'agent/initial-theory-experiments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jingxuxie/game-epistemic-price
          ref: agent/initial-theory-experiments
          token: ${{ github.token }}
      - name: Expand checksum-verified source archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bootstrap/source.tar.gz ]]; then
            echo 'Clean source tree is already published.'
            exit 0
          fi
          echo 'ea96bba9633f48416d5a9665bcc81c2ab3e2a9a397a2a537ff7042d58fd7899a  bootstrap/source.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/epoc-source
          tar -xzf bootstrap/source.tar.gz -C /tmp/epoc-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/epoc-source/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish manuscript and expand literature audit'
          git push origin HEAD:agent/initial-theory-experiments
