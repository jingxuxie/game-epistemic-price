name: expand-source-bootstrap

on:
  push:
    branches: [agent/initial-theory-experiments]

permissions:
  contents: write

concurrency:
  group: expand-source-bootstrap
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand staged source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/text-project.tar.gz.b64.part-* > /tmp/source.tar.gz.b64
          base64 --decode /tmp/source.tar.gz.b64 > /tmp/source.tar.gz
          echo 'b82bd2b7cb7490574f481972dafcaff751d793f6df8b736cb2034c3b020d04de  /tmp/source.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/source-tree
          tar -xzf /tmp/source.tar.gz -C /tmp/source-tree
          shopt -s dotglob nullglob
          items=(/tmp/source-tree/*)
          if [[ ${#items[@]} -eq 1 && -d ${items[0]} ]]; then
            source_root="${items[0]}"
          else
            source_root=/tmp/source-tree
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$source_root"/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expand initial EPoC source tree'
          git push origin HEAD:agent/initial-theory-experiments
